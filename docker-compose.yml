version: '3.8'

services:
  api:
    build:
      context: ./backend
    container_name: fretbox_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
    container_name: fretbox_worker
    command: celery -A app.celery_app.celery worker --loglevel=info -E
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - api
      - redis

  redis:
    image: redis:7-alpine
    container_name: fretbox_redis
    ports:
      - "6379:6379"
