name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Typecheck, lint, unit, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

  # E2E is intentionally not part of CI: the authenticated suite requires a
  # dedicated Convex deployment plus operator credentials. Run it locally or
  # against a preview deployment before release (see docs/runbook.md).
